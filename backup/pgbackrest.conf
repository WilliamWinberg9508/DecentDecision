# pgBackRest, mounted at /etc/pgbackrest/pgbackrest.conf in both the database
# container and the backup sidecar.
#
# Nothing secret belongs in this file -- it is in the repository. The S3 keys
# for the off-machine copy come from the environment instead (see .env).

[global]
repo1-path=/var/lib/pgbackrest

# Two full backups kept, and the WAL needed to recover from either. Raising
# this is the cheapest safety you can buy; the incrementals in between are
# small. Expiry runs automatically after every backup.
repo1-retention-full=2
repo1-retention-full-type=count

# Bundling packs small files together and block incremental stores only the
# changed parts of a file rather than the whole file. Both need pgBackRest
# 2.46 or newer.
repo1-bundle=y
repo1-block=y

compress-type=zst
compress-level=3
process-max=2

log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail

# Take the checkpoint immediately rather than waiting for the next scheduled
# one. Costs a burst of I/O, saves the backup sitting idle for minutes first.
start-fast=y

# Archive WAL in the background, so a slow or briefly unavailable repository
# stalls the archiver rather than the database.
archive-async=y
spool-path=/var/spool/pgbackrest

# --- off-machine copy ---------------------------------------------------------
# A repository on the same disk as the database protects you from DROP TABLE,
# from a bad migration and from the purge button. It protects you from nothing
# that happens to the machine. Uncomment this block, put the keys in .env, and
# there is a second copy somewhere else.
#
# Cloudflare R2 speaks S3 and charges nothing for egress, which matters on the
# day you actually restore.
#
#repo2-type=s3
#repo2-path=/decentdecision
#repo2-s3-bucket=decentdecision-backups
#repo2-s3-endpoint=<your-account-id>.r2.cloudflarestorage.com
#repo2-s3-region=auto
#repo2-s3-uri-style=path
#repo2-retention-full=4
#repo2-bundle=y
#repo2-block=y
# The two keys come from the environment:
#   PGBACKREST_REPO2_S3_KEY / PGBACKREST_REPO2_S3_KEY_SECRET

[dd]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-socket-path=/var/run/postgresql

# The superuser this stack actually creates. pgBackRest defaults to connecting
# as "postgres", which does not exist here -- leaving this out gives you
# "unable to find primary cluster" at stanza-create, which reads like a much
# more alarming problem than it is.
pg1-user=vote
pg1-database=postgres
