# Decent Decision. Self-contained: its own database, backups and Cloudflare
# tunnel, independent of anything else running on the machine.
#
#   docker compose up -d --build
#
# The tunnel (the cloudflared service at the bottom) only starts when .env
# has COMPOSE_PROFILES=public and DD_TUNNEL_TOKEN set, so the same file runs
# a private local copy without it. It dials out to Cloudflare: nothing is
# opened on the router or the firewall. See README.md.

services:
  postgres:
    # Not the stock image any more: archive_command runs inside this container,
    # so this container needs pgbackrest. See backup/Dockerfile.postgres.
    build:
      context: .
      dockerfile: backup/Dockerfile.postgres
    image: decentdecision-postgres:16
    restart: always
    environment:
      - POSTGRES_USER=vote
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=vote
    # List form, so no shell parses this and %p reaches Postgres intact.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=dd archive-push %p
      - -c
      - archive_timeout=300
    volumes:
      - votedata:/var/lib/postgresql/data
      - backuprepo:/var/lib/pgbackrest
      - backupspool:/var/spool/pgbackrest
      - pgsocket:/var/run/postgresql
      - ./backup/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vote -d vote"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Weekly full, daily incremental, and the restore drill lives here too:
  #   docker compose exec backup /backup/restore-drill.sh
  backup:
    # Same image as the database, built here too rather than only referenced:
    # `docker compose pull` would otherwise try to fetch a tag that only ever
    # exists locally. The build is cached, so this costs nothing.
    build:
      context: .
      dockerfile: backup/Dockerfile.postgres
    image: decentdecision-postgres:16
    restart: always
    user: postgres
    entrypoint: ["/bin/sh", "/backup/backup-loop.sh"]
    environment:
      - POSTGRES_USER=vote
      - POSTGRES_DB=vote
      - PGBACKREST_STANZA=dd
      - BACKUP_FULL_DOW=${BACKUP_FULL_DOW:-0}
      - BACKUP_HOUR=${BACKUP_HOUR:-3}
      # Only set when the off-machine repository in pgbackrest.conf is enabled.
      - PGBACKREST_REPO2_S3_KEY=${R2_ACCESS_KEY_ID:-}
      - PGBACKREST_REPO2_S3_KEY_SECRET=${R2_SECRET_ACCESS_KEY:-}
    volumes:
      # Read-only: this container takes backups, so it never has any business
      # writing to the live data directory.
      - votedata:/var/lib/postgresql/data:ro
      - backuprepo:/var/lib/pgbackrest
      - backupspool:/var/spool/pgbackrest
      - pgsocket:/var/run/postgresql
      - ./backup:/backup:ro
      - ./backup/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    container_name: decentdecision-api
    restart: always
    environment:
      - DATABASE_URL=postgresql://vote:${POSTGRES_PASSWORD}@postgres:5432/vote
      - ADMIN_TOKEN=${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      # Must be true once Cloudflare is serving this over HTTPS.
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      - SITE_URL=${SITE_URL:-http://localhost:8100}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-25}
      - SMTP_FROM=${SMTP_FROM:-noreply@decentdecision.com}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - ABUSE_CONTACT=${ABUSE_CONTACT:-}
      - BTC_ADDRESS=${BTC_ADDRESS:-}
      - AUTO_APPROVE_VERIFIED=${AUTO_APPROVE_VERIFIED:-true}
      - SIGNUPS_PER_HOUR=${SIGNUPS_PER_HOUR:-5}
      - BLOCKED_EMAIL_DOMAINS=${BLOCKED_EMAIL_DOMAINS:-}
      - LOGIN_FAILS_PER_IP=${LOGIN_FAILS_PER_IP:-20}
      - LOGIN_FAILS_PER_ACCOUNT=${LOGIN_FAILS_PER_ACCOUNT:-8}
      - RESET_TTL_MINUTES=${RESET_TTL_MINUTES:-60}
    # The site's texts, mounted so an edit shows on the next page load
    # without a rebuild. Read-only: the app never writes to it.
    volumes:
      - ./texts.toml:/srv/texts.toml:ro
      - ./essay.md:/srv/essay.md:ro
    depends_on:
      postgres:
        condition: service_healthy
    # Loopback only, for you. Public traffic arrives through the tunnel
    # below, over the stack's own network, never through this port.
    ports:
      - "127.0.0.1:8100:8000"

  # The public way in: a Cloudflare tunnel of this site's own. In the Zero
  # Trust dashboard its public hostname points at http://api:8000. It is the
  # only thing besides you that can reach the api, which is what makes
  # trusting its CF-Connecting-IP header for rate limits safe.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["public"]
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      # A secret: whoever holds it can serve traffic as your tunnel.
      - TUNNEL_TOKEN=${DD_TUNNEL_TOKEN:-}
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  votedata:
  backuprepo:
  backupspool:
  pgsocket:

