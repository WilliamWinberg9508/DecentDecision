name: tests

on:
  push:
    branches: [main, master]
  pull_request:

# A pull request from a fork can only read the code.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run the tests against a throwaway Postgres
        run: docker compose -f docker-compose.test.yml run --rm tests
      - name: Clean up
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
